name: Crawl bestseller data

on:
  workflow_dispatch:      # 저장소 Actions 탭에서 수동으로 "Run workflow" 눌러서 테스트 가능
  schedule:
    - cron: "0 21 * * *"  # 매일 UTC 21:00 = 한국시간 06:00

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run kyobo crawler
        continue-on-error: true
        run: python scripts/crawl_kyobo.py

      - name: Run millie crawler
        continue-on-error: true
        run: python scripts/crawl_millie.py

      - name: Run cremaclub crawler
        continue-on-error: true
        run: python scripts/crawl_cremaclub.py

      - name: Build merged JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "cremaclub": "data/cremaclub_today.json",
              "kyobo_premium": "data/kyobo_premium_today.json",
              "kyobo_unlimited": "data/kyobo_unlimited_today.json",
              "millie": "data/millie_today.json",
          }

          merged = {}

          for name, file_path in files.items():
              path = Path(file_path)

              if path.exists():
                  with path.open("r", encoding="utf-8") as f:
                      merged[name] = json.load(f)
              else:
                  merged[name] = []

          with open("data/merged.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)

          print("merged.json created")
          PY

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "chore: update bestseller data $(date -u +%Y-%m-%d)"
          git push
