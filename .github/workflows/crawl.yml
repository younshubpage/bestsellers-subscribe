name: Crawl bestseller data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run kyobo crawler
        continue-on-error: true
        run: python scripts/crawl_kyobo.py

      - name: Run millie crawler
        continue-on-error: true
        run: python scripts/crawl_millie.py

      - name: Run cremaclub crawler
        continue-on-error: true
        run: python scripts/crawl_cremaclub.py

      - name: Build data.json
        run: python scripts/build_data.py

      - name: Check data.json
        run: |
          if [ -f data.json ]; then
            echo "data.json created successfully"
            ls -lh data.json
          else
            echo "ERROR: data.json was not created"
            exit 1
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ data.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update bestseller data $(date -u +%Y-%m-%d)"
            git push
          fi
